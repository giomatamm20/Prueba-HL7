# Standalone deployment: simulator only, with no legacy sender or LIS database.
# Usage: docker compose --env-file .env.server -f docker-compose.server.yml up -d --build
services:
  analyzer-simulator-api:
    image: ${SIMULATOR_IMAGE:-hl7-simulator:local}
    build:
      context: ./services/analyzer-simulator-api
    environment:
      SIMULATOR_DB_PATH: /app/data/${SIMULATOR_DB_FILE:-simulator.db}
      ORDER_LISTEN_HOST: 0.0.0.0
      ORDER_LISTENERS_ENABLED: "true"
      SIMULATOR_ALLOWED_LISTEN_PORTS: "5001-5004,5010-5011,5020,9500,5100-5119"
      SIMULATOR_READ_TIMEOUT: ${SIMULATOR_READ_TIMEOUT:-30}
      SIMULATOR_MAX_MESSAGE_BYTES: ${SIMULATOR_MAX_MESSAGE_BYTES:-4194304}
      SIMULATOR_MAX_CONNECTIONS: ${SIMULATOR_MAX_CONNECTIONS:-64}
      RESULT_DESTINATION_HOST: ${RESULT_DESTINATION_HOST:-host.docker.internal}
      RESULT_DESTINATION_PORT: ${RESULT_DESTINATION_PORT:-2575}
      PACS_ORDER_PORT: 5020
      PACS_NOTIFICATION_HOST: ${PACS_NOTIFICATION_HOST:-host.docker.internal}
      PACS_NOTIFICATION_PORT: ${PACS_NOTIFICATION_PORT:-2575}
      PACS_LEGACY_KEY_CODE: ${PACS_LEGACY_KEY_CODE:-}
      PACS_LEGACY_KEY: ${PACS_LEGACY_KEY:-}
      PACS_LEGACY_IV_HEX: ${PACS_LEGACY_IV_HEX:-}
      PACS_LEGACY_USERNAME: ${PACS_LEGACY_USERNAME:-}
    ports:
      - "${SIMULATOR_BIND_IP:?Set SIMULATOR_BIND_IP to the server private IP}:${ANALYZER_SIMULATOR_PORT:-8090}:8090"
      - "${SIMULATOR_BIND_IP}:5001-5004:5001-5004/tcp"
      - "${SIMULATOR_BIND_IP}:5010-5011:5010-5011/tcp"
      - "${SIMULATOR_BIND_IP}:5020:5020/tcp"
      - "${SIMULATOR_BIND_IP}:9500:9500/tcp"
      - "${SIMULATOR_BIND_IP}:5100-5119:5100-5119/tcp"
    volumes:
      - "${SIMULATOR_DATA_DIR:-./data}:/app/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8090/api/health',timeout=3)); raise SystemExit(r['status']!='ok')"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
