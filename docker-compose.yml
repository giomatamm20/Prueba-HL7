services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hl7sandbox}
      POSTGRES_USER: ${POSTGRES_USER:-hl7user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hl7password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sandbox-network

  hl7-listener:
    build:
      context: ./services/hl7-listener
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 2575
      DATABASE_URL: postgresql://${POSTGRES_USER:-hl7user}:${POSTGRES_PASSWORD:-hl7password}@postgres:5432/${POSTGRES_DB:-hl7sandbox}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HL7_LISTENER_PORT:-2575}:2575"
    networks:
      - sandbox-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 2575), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  sandbox-network:
    name: hl7-sandbox-network

volumes:
  postgres-data:
