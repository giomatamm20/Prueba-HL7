services:
  analyzer-simulator-api:
    build:
      context: ./services/analyzer-simulator-api
    environment:
      RESULT_DESTINATION_HOST: ${RESULT_DESTINATION_HOST:-host.docker.internal}
      RESULT_DESTINATION_PORT: ${RESULT_DESTINATION_PORT:-2575}
      ORDER_LISTENERS_ENABLED: ${ORDER_LISTENERS_ENABLED:-true}
      SIMULATOR_DB_PATH: /app/data/simulator.db
    ports:
      - "${ANALYZER_SIMULATOR_PORT:-8090}:8090"
      - "${ABBOTT_RUBY_ORDER_PORT:-5001}:5001"
      - "${SYSMEX_XN_ORDER_PORT:-5002}:5002"
      - "${ARCHITECT_ORDER_PORT:-5003}:5003"
      - "${SYSMEX_UC_ASTM_ORDER_PORT:-5004}:5004"
      - "${GENERIC_HL7_ORDER_PORT:-5010}:5010"
      - "${GENERIC_ASTM_ORDER_PORT:-5011}:5011"
    volumes:
      - ./services/analyzer-simulator-api/data:/app/data
    restart: unless-stopped

  fake-analyzer:
    build:
      context: ./services/fake-analyzer
    environment:
      DESTINATION_HOST: ${HOST_MIDDLEWARE_HOST:?Set HOST_MIDDLEWARE_HOST to the PC running the HL7 host}
      DESTINATION_PORT: ${HOST_MIDDLEWARE_PORT:-2575}
      SEND_INTERVAL_SECONDS: ${SEND_INTERVAL_SECONDS:-10}
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-8}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-5}
      ANALYZER_NAME: ${ANALYZER_NAME:-ABBOTT_CELL_DYN}
      SAMPLES_DIR: /app/samples
    volumes:
      - ./samples/hl7:/app/samples:ro
    command: ["python", "-m", "app.main", "auto"]
    restart: unless-stopped
